trigger:
  branches:
    include:
      - master   # Fixed: Changed from main to match your actual GitHub repository branch

pool:
  vmImage: 'ubuntu-latest'

stages:

# ============================================================
# STAGE 1: BUILD AND TEST
# ============================================================
- stage: Build_Test
  displayName: 'Build and Run Tests'

  jobs:
  - job: BuildAndTest
    displayName: 'Python Build and Unit Tests'

    steps:
    - checkout: self
      fetchDepth: 0
      displayName: 'Checkout Source Code'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.8'
        addToPath: true
      displayName: 'Setup Python 3.8'

    - script: |
        python -m pip install --upgrade pip
      displayName: 'Upgrade pip'

    - script: |
        if [ -f requirement.txt ]; then
          pip install -r requirement.txt
        else
          pip install flask
        fi
      displayName: 'Install Dependencies'

    - script: |
        pip install pytest pytest-html pytest-cov
      displayName: 'Install Unit Test Dependencies'

    - script: |
        python -m py_compile app.py || echo "app.py compilation skipped or failed"
        python -m py_compile house.py || echo "house.py compilation skipped or failed"
      displayName: 'Validate Python Code'

    - script: |
        mkdir -p test-results
      displayName: 'Create Test Result Folder'

    - script: |
        pytest tests/test_app_50_cases.py \
          -v \
          -ra \
          --junitxml=test-results/junit.xml \
          --html=test-results/unit-test-report.html \
          --self-contained-html \
          --cov=. \
          --cov-report=xml:test-results/coverage.xml \
          --cov-report=term
      displayName: 'Run 50 Unit Tests'
      continueOnError: true

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/junit.xml'
        testRunTitle: 'House Price Prediction Unit Tests'
        failTaskOnFailedTests: false
      displayName: 'Publish Unit Test Results'

    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: 'test-results'
        artifact: 'test-results'
        publishLocation: 'pipeline'
      displayName: 'Publish Test Results Artifact'

# ============================================================
# STAGE 2: SONARQUBE CLOUD ANALYSIS
# ============================================================
- stage: SonarQube
  displayName: 'SonarQube Code Quality Analysis'
  dependsOn: Build_Test
  condition: succeededOrFailed()

  jobs:
  - job: SonarQubeAnalysis
    displayName: 'SonarQube Cloud Analysis'

    steps:
    - checkout: self
      fetchDepth: 0
      displayName: 'Checkout Source Code'

    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'test-results'
        path: '$(Pipeline.Workspace)/test-results'
      displayName: 'Download Test Results and Coverage'

    # FIXED BLOCK BELOW: Points directly to your verified connection and handles keys properly
    - task: SonarQubeCloudPrepare@2
      inputs:
        SonarQubeCloud: 'sonarcloud' # Fixed: Matches your exact Azure DevOps service connection name
        organization: 'maheshpasapala'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'House-price-prediction-using-flask'
        cliProjectName: 'House Price Prediction'
        cliSources: '.'
        extraProperties: |
          sonar.exclusions=**/tests/**,**/__pycache__/**,**/.pytest_cache/**
          sonar.python.version=3.8
          sonar.python.coverage.reportPaths=$(Pipeline.Workspace)/test-results/coverage.xml
      displayName: 'Prepare SonarQube Cloud Analysis'

    - task: SonarQubeCloudAnalyze@2
      displayName: 'Run SonarQube Cloud Analysis'

    - task: SonarQubeCloudPublish@2
      inputs:
        pollingTimeoutSec: '300'
      displayName: 'Publish SonarQube Quality Gate'

# ============================================================
# STAGE 3: START FLASK APPLICATION
# ============================================================
- stage: Run_Application
  displayName: 'Run Flask Application'
  dependsOn: SonarQube
  condition: succeeded()

  jobs:
  - job: StartFlask
    displayName: 'Start Flask Application'

    steps:
    - checkout: self
      displayName: 'Checkout Source Code'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.8'
        addToPath: true
      displayName: 'Setup Python 3.8'

    - script: |
        if [ -f requirement.txt ]; then pip install -r requirement.txt; else pip install flask; fi
      displayName: 'Install Dependencies'

    - script: |
        python app.py &
        sleep 10
        echo "Flask application started successfully"
      displayName: 'Start Flask Application'
