trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  imageName: housebuild
  imageTag: ci

stages:
  - stage: Build_Test
    displayName: Build image and run tests
    jobs:
      - job: BuildAndTest
        displayName: Build Docker image and run unit tests
        steps:
          - checkout: self
            fetchDepth: 0

          - script: docker build -t $(imageName):$(imageTag) .
            displayName: Build Docker image

          - script: |
              mkdir -p test-results
              docker run --rm \
                -v "$(System.DefaultWorkingDirectory)/test-results:/app/test-results" \
                $(imageName):$(imageTag) \
                python -m pytest test_app_50_cases.py \
                  --verbose \
                  --junitxml=test-results/junit.xml \
                  --html=test-results/unit-test-report.html \
                  --self-contained-html \
                  --cov=. \
                  --cov-report=xml:test-results/coverage.xml \
                  --cov-report=term
            displayName: Run containerized tests
            continueOnError: true

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results/junit.xml
              testRunTitle: Housebuild container tests
              failTaskOnFailedTests: false
            displayName: Publish test results

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: test-results
              artifact: test-results
              publishLocation: pipeline
            displayName: Publish test reports

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/docker-image"
              docker save $(imageName):$(imageTag) \
                -o "$(Build.ArtifactStagingDirectory)/docker-image/housebuild-image.tar"
            displayName: Export Docker image

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/docker-image
              artifact: docker-image
              publishLocation: pipeline
            displayName: Publish Docker image artifact

  - stage: SonarQube
    displayName: SonarQube code quality analysis
    dependsOn: Build_Test
    condition: succeededOrFailed()
    jobs:
      - job: SonarQubeAnalysis
        displayName: Analyze source code
        steps:
          - checkout: self
            fetchDepth: 0

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: test-results
              path: $(Pipeline.Workspace)/test-results
            displayName: Download test reports

          - task: SonarCloudPrepare@4
            inputs:
              SonarCloud: SonarQube-House-Project
              organization: maheshpasapala
              scannerMode: cli
              configMode: manual
              cliProjectKey: House-price-prediction-using-flask
              cliProjectName: House Price Prediction
              cliSources: .
              extraProperties: |
                sonar.exclusions=**/test_app_50_cases.py,**/__pycache__/**,**/.pytest_cache/**
                sonar.python.version=3.8
                sonar.python.coverage.reportPaths=$(Pipeline.Workspace)/test-results/coverage.xml
            displayName: Prepare SonarCloud analysis

          - task: SonarCloudAnalyze@4
            inputs:
              jdkversion: JAVA_HOME_17_X64
            displayName: Run SonarCloud analysis

          - task: SonarCloudPublish@4
            inputs:
              pollingTimeoutSec: '300'
            displayName: Publish quality gate

  - stage: Run_Application
    displayName: Run container smoke test
    dependsOn: SonarQube
    condition: succeeded()
    jobs:
      - job: StartContainer
        displayName: Start application with Docker Compose
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: docker-image
              path: $(Pipeline.Workspace)/docker-image
            displayName: Download Docker image

          - script: docker load --input "$(Pipeline.Workspace)/docker-image/housebuild-image.tar"
            displayName: Load Docker image

          - script: |
              docker tag $(imageName):$(imageTag) housebuild:local
              docker compose up -d --no-build
              trap 'docker compose down' EXIT
              curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:5000/
              docker compose ps
            displayName: Start and smoke-test application